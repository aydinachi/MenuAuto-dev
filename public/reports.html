<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuAuto - Izvještaji</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid mt-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-file-earmark-text"></i> Izvještaji</h1>
            <a href="/" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Nazad na aplikaciju
            </a>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Filteri</h5>
                <div class="row">
                    <div class="col-md-3">
                        <label for="dateFilter" class="form-label">Datum:</label>
                        <input type="date" class="form-control" id="dateFilter">
                    </div>
                    <div class="col-md-3">
                        <label for="startDateFilter" class="form-label">Od datuma:</label>
                        <input type="date" class="form-control" id="startDateFilter">
                    </div>
                    <div class="col-md-3">
                        <label for="endDateFilter" class="form-label">Do datuma:</label>
                        <input type="date" class="form-control" id="endDateFilter">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary d-block" onclick="loadReports()">
                            <i class="bi bi-search"></i> Pretraži
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reports List -->
        <div id="reportsList">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Učitavanje...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Report Details Modal -->
    <div class="modal fade" id="reportDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Detalji izvještaja</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="reportDetailsContent">
                    <!-- Report details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Zatvori</button>
                    <button type="button" class="btn btn-primary" onclick="exportReport()">
                        <i class="bi bi-download"></i> Izvezi CSV
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentReport = null;
        let reportDetailsModal = null;

        document.addEventListener('DOMContentLoaded', function() {
            reportDetailsModal = new bootstrap.Modal(document.getElementById('reportDetailsModal'));
            loadReports();
        });

        async function loadReports() {
            try {
                const dateFilter = document.getElementById('dateFilter').value;
                const startDateFilter = document.getElementById('startDateFilter').value;
                const endDateFilter = document.getElementById('endDateFilter').value;

                let url = '/api/shifts/reports';
                const params = new URLSearchParams();
                
                if (dateFilter) {
                    params.append('date', dateFilter);
                } else if (startDateFilter && endDateFilter) {
                    params.append('start_date', startDateFilter);
                    params.append('end_date', endDateFilter);
                }

                if (params.toString()) {
                    url += '?' + params.toString();
                }

                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                const data = await response.json();
                renderReports(data.reports);
            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reportsList').innerHTML = 
                    '<div class="alert alert-danger">Greška pri učitavanju izvještaja</div>';
            }
        }

        function renderReports(reports) {
            const container = document.getElementById('reportsList');
            
            if (reports.length === 0) {
                container.innerHTML = `
                    <div class="text-center">
                        <i class="bi bi-file-earmark-text" style="font-size: 3rem; color: #6c757d;"></i>
                        <h5 class="mt-3">Nema izvještaja</h5>
                        <p class="text-muted">Nema izvještaja za odabrani period</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = reports.map(report => `
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <h6 class="card-title">Datum: ${new Date(report.report_date).toLocaleDateString()}</h6>
                                <p class="text-muted">${report.shift_start} - ${report.shift_end}</p>
                            </div>
                            <div class="col-md-3">
                                <p class="mb-1"><strong>Ukupno narudžbi:</strong> ${report.total_orders}</p>
                                <p class="mb-1"><strong>Ukupan prihod:</strong> ${parseFloat(report.total_revenue).toFixed(2)} KM</p>
                            </div>
                            <div class="col-md-3">
                                <p class="mb-1"><strong>Otpisane narudžbe:</strong> ${report.total_cancelled_orders}</p>
                                <p class="mb-1"><strong>Otpisani prihod:</strong> ${parseFloat(report.total_cancelled_revenue).toFixed(2)} KM</p>
                            </div>
                            <div class="col-md-3">
                                <p class="text-muted">Kreirao: ${report.created_by_name}</p>
                                <button class="btn btn-primary btn-sm" onclick="showReportDetails(${report.id})">
                                    <i class="bi bi-eye"></i> Detalji
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function showReportDetails(reportId) {
            try {
                const response = await fetch(`/api/shifts/reports/${reportId}`, {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                const data = await response.json();
                currentReport = data.report;
                renderReportDetails(data.report);
                reportDetailsModal.show();
            } catch (error) {
                console.error('Error loading report details:', error);
                alert('Greška pri učitavanju detalja izvještaja');
            }
        }

        function renderReportDetails(report) {
            const content = document.getElementById('reportDetailsContent');
            
            content.innerHTML = `
                <div class="mb-3">
                    <h6>Opći podaci</h6>
                    <p><strong>Datum:</strong> ${new Date(report.report_date).toLocaleDateString()}</p>
                    <p><strong>Smjena:</strong> ${report.shift_start} - ${report.shift_end}</p>
                    <p><strong>Ukupan prihod:</strong> ${parseFloat(report.total_revenue).toFixed(2)} KM</p>
                    <p><strong>Otpisani prihod:</strong> ${parseFloat(report.total_cancelled_revenue).toFixed(2)} KM</p>
                </div>
                
                <div class="mb-3">
                    <h6>Detalji po artiklima</h6>
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Artikal</th>
                                    <th>Kategorija</th>
                                    <th>Prodano</th>
                                    <th>Otpisano</th>
                                    <th>Prihod</th>
                                    <th>Otpisani prihod</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${report.items.map(item => `
                                    <tr>
                                        <td>${item.item_name}</td>
                                        <td>${item.category}</td>
                                        <td>${item.quantity_sold}</td>
                                        <td>${item.quantity_cancelled}</td>
                                        <td>${parseFloat(item.total_revenue).toFixed(2)} KM</td>
                                        <td>${parseFloat(item.cancelled_revenue).toFixed(2)} KM</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function exportReport() {
            if (!currentReport) return;
            
            const csvContent = generateCSV(currentReport);
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute('href', url);
                link.setAttribute('download', `izvjestaj_${currentReport.report_date}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function generateCSV(report) {
            const headers = ['Artikal', 'Kategorija', 'Prodano', 'Otpisano', 'Prihod', 'Otpisani prihod'];
            const rows = report.items.map(item => [
                item.item_name,
                item.category,
                item.quantity_sold,
                item.quantity_cancelled,
                parseFloat(item.total_revenue).toFixed(2),
                parseFloat(item.cancelled_revenue).toFixed(2)
            ]);
            
            return [headers, ...rows].map(row => row.join(',')).join('\n');
        }
    </script>
</body>
</html>
